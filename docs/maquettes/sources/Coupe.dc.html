class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { after: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0F766E';
    const after = this.state.after;
    return {
      accent,
      sdbWall: after ? '#A9D8DC' : '#CDBFA6',
      stainO: after ? 0 : 0.85,
      newO: after ? 1 : 0,
      avantBg: after ? 'transparent' : '#FFFFFF',
      avantFg: after ? '#475467' : '#101828',
      apresBg: after ? '#FFFFFF' : 'transparent',
      apresFg: after ? '#101828' : '#475467',
      pickAvant: () => this.setState({ after: false }),
      pickApres: () => this.setState({ after: true })
    };
  }
}
</script>
