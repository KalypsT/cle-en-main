name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A pull request's older run is cancelled; on main, a deployment is never cut halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate content
        run: pnpm validate-content

      - name: Bots (10 years, sample seeds)
        run: |
          for seed in 1 2 3; do pnpm --silent bots --seed "$seed" --days 3650; echo; done

      # A small sample: it must run without error; the full 1 000-game report is made locally.
      - name: Bot series (sample)
        run: pnpm --silent bots:series --games 10 --years 10

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @cle/game exec playwright install --with-deps chromium

      - name: Smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/game/playwright-report/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/game/dist

      # The DomoThib Games build (docs/domothib.md), in the same dist/ once the Pages one is kept:
      # no second install for the deployment job.
      - name: Build for DomoThib Games
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm build:domothib

      - name: Upload DomoThib build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: domothib
          path: apps/game/dist
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Host of DomoThib Games (docs/domothib.md, §7): a merge into main is online in DomoThib at once.
  domothib:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: domothib-deploy
      cancel-in-progress: false
    steps:
      - name: Download DomoThib build
        uses: actions/download-artifact@v4
        with:
          name: domothib
          path: apps/game/dist

      - name: Check the manifest
        env:
          GAME_ID: cle-en-main
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("apps/game/dist/domothib.json", "utf8"));
            if (m.protocole !== 1 || m.id !== process.env.GAME_ID) { console.error("domothib.json invalide"); process.exit(1); }
          '

      - name: Send to the games host
        env:
          SSH_KEY: ${{ secrets.JEUX_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jeux && chmod 600 ~/.ssh/jeux
          rsync -rlz --delete-after --delay-updates --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/jeux" apps/game/dist/ "jeux-deploy@$VPS_HOST:./"
